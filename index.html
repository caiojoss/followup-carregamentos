<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carregamentos — Followup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<!-- Firebase (Realtime Database) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#0B0F14;
    --panel:#121922;
    --panel-2:#0F1620;
    --border:#212B36;
    --text:#E8EDF2;
    --muted:#7C8B99;
    --muted-2:#54626E;
    --red:#E5484D;
    --red-dim:#3A1E1F;
    --yellow:#F5A623;
    --yellow-dim:#3A2E14;
    --green:#2BB673;
    --green-dim:#173326;
    --cyan:#36C5F0;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:18px 14px 80px;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }

  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .label{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .brand .date{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    color:var(--muted);
  }

  .conn{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--muted-2);
    transition:background .3s;
  }
  .dot.live{
    background:var(--green);
    box-shadow:0 0 0 0 rgba(43,182,115,0.6);
    animation:pulse 2s infinite;
  }
  .dot.off{ background:var(--red); }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(43,182,115,0.5);}
    70%{box-shadow:0 0 0 6px rgba(43,182,115,0);}
    100%{box-shadow:0 0 0 0 rgba(43,182,115,0);}
  }

  .editor-row{
    display:flex;
    justify-content:flex-end;
    margin-bottom:16px;
  }
  .who{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--cyan);
    background:rgba(54,197,240,0.08);
    border:1px solid rgba(54,197,240,0.25);
    padding:4px 10px;
    border-radius:5px;
    cursor:pointer;
  }

  /* ---------- DATE HEADER + DRAWER ---------- */
  .dateheader{ margin-bottom:16px; }
  .dateBtn{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.5px;
    padding:13px 14px;
    border-radius:9px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    text-transform:uppercase;
  }
  .dateBtn:active{ border-color:var(--cyan); }
  .dateBtn svg{ width:16px; height:16px; opacity:0.6; flex-shrink:0; }
  .dateBtn .tag{
    font-size:10px;
    background:rgba(54,197,240,0.12);
    color:var(--cyan);
    padding:2px 7px;
    border-radius:4px;
    letter-spacing:0.5px;
  }

  .drawer-bg{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .drawer-bg.open{ display:flex; }
  .drawer{
    background:var(--panel);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:18px 18px 0 0;
    padding:10px 20px 26px;
    max-width:640px;
    width:100%;
    box-sizing:border-box;
    overflow-x:hidden;
    animation:slideUp .22s ease-out;
  }
  @keyframes slideUp{
    from{ transform:translateY(100%); }
    to{ transform:translateY(0); }
  }
  .drawer-handle{
    width:36px; height:4px;
    background:var(--border);
    border-radius:3px;
    margin:0 auto 16px;
  }
  .drawer h3{
    margin:0 0 14px;
    font-family:'Oswald',sans-serif;
    font-size:17px;
    text-align:center;
  }
  .quickdates{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .quickdates button{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    padding:10px 6px;
    border-radius:8px;
    cursor:pointer;
  }
  .quickdates button:active{ border-color:var(--cyan); color:var(--cyan); }
  .cal{ margin-top:4px; }
  .cal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .cal-head button{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    width:32px; height:32px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    line-height:1;
  }
  .cal-head span{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--muted);
  }
  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted-2);
    margin-bottom:4px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:2px;
  }
  .cal-day{
    aspect-ratio:1;
    min-width:0;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    border:none;
    background:none;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13px;
    border-radius:8px;
    cursor:pointer;
    position:relative;
  }
  .cal-day:active{ background:var(--panel-2); }
  .cal-day.empty{ visibility:hidden; cursor:default; }
  .cal-day.today{ color:var(--cyan); font-weight:700; }
  .cal-day.selected{ background:rgba(54,197,240,0.15); border:1px solid var(--cyan); }
  .cal-day .dot{
    width:4px; height:4px;
    border-radius:50%;
    background:var(--green);
  }
  .cal-day .dot.empty-dot{ visibility:hidden; }

  /* ---------- LIST ---------- */
  .list{ display:flex; flex-direction:column; gap:9px; }

  .item{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 10px;
    display:grid;
    grid-template-columns:30px 1fr 44px 30px;
    align-items:center;
    gap:10px;
    position:relative;
    transition:transform .15s, opacity .15s;
  }
  .item.removing{
    transform:scale(0.96);
    opacity:0;
  }

  .seq{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:18px;
    color:var(--muted-2);
    text-align:center;
  }

  .info{ overflow:hidden; }
  .name{
    font-weight:600;
    font-size:15px;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    border:none;
    background:none;
    color:var(--text);
    width:100%;
    padding:0;
    font-family:'Inter',sans-serif;
  }
  .name:focus{ outline:none; }
  .meta{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-top:2px;
  }

  .status{
    width:40px; height:40px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .12s;
  }
  .status:active{ transform:scale(0.88); }
  .status.red{ background:var(--red); }
  .status.yellow{ background:var(--yellow); }
  .status.green{ background:var(--green); }
  .status svg{ width:18px; height:18px; }

  .order{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .order button{
    background:none;
    border:none;
    color:var(--muted-2);
    cursor:pointer;
    padding:3px;
    line-height:0;
  }
  .order button:hover{ color:var(--cyan); }
  .order button:disabled{ opacity:0.2; cursor:default; }

  .del{
    position:absolute;
    top:-7px; right:-7px;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--muted);
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- EMPTY ---------- */
  .empty{
    text-align:center;
    color:var(--muted);
    padding:50px 20px;
    font-size:13px;
    border:1px dashed var(--border);
    border-radius:10px;
  }
  .empty b{ color:var(--text); display:block; margin-bottom:4px; font-size:14px;}

  /* ---------- ADD BAR (fixed bottom) ---------- */
  .addbar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    padding:16px 14px 18px;
  }
  .addbar-inner{
    max-width:640px;
    margin:0 auto;
    display:flex;
    gap:8px;
  }
  .addbar input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:13px 14px;
    border-radius:9px;
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .addbar input::placeholder{ color:var(--muted-2); }
  .addbar input:focus{ outline:none; border-color:var(--cyan); }
  .addbar button{
    background:var(--cyan);
    border:none;
    color:#06141C;
    font-weight:700;
    padding:0 18px;
    border-radius:9px;
    cursor:pointer;
    font-size:20px;
  }

  /* ---------- LEGEND ---------- */
  .legend{
    display:flex;
    gap:14px;
    justify-content:center;
    margin:18px 0 4px;
    font-size:11px;
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
  }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .sq{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  /* ---------- NAME MODAL ---------- */
  .modal-bg{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-bg.open{ display:flex; }
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
    max-width:320px;
    width:100%;
  }
  .modal h3{
    margin:0 0 4px;
    font-family:'Oswald',sans-serif;
    font-size:17px;
  }
  .modal p{ color:var(--muted); font-size:13px; margin:0 0 14px; }
  .modal input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 12px;
    border-radius:8px;
    font-size:14px;
    margin-bottom:12px;
  }
  .modal input:focus{ outline:none; border-color:var(--cyan); }
  .modal button{
    width:100%;
    background:var(--cyan);
    border:none;
    color:#06141C;
    font-weight:700;
    padding:11px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
  }

  @media (max-width:380px){
    .item{ grid-template-columns:24px 1fr 40px 26px; padding:10px 8px; }
    .status{ width:36px; height:36px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <span class="label">Carregamentos</span>
    </div>
    <div class="conn">
      <span class="dot" id="connDot"></span>
      <span id="connText">conectando…</span>
    </div>
  </div>

  <div class="editor-row">
    <span class="who" id="whoBtn">você é: —</span>
  </div>

  <div class="dateheader">
    <button class="dateBtn" id="dateBtn"></button>
  </div>

  <div class="list" id="list"></div>

  <div class="legend">
    <span><i class="sq" style="background:var(--red)"></i> não chegou</span>
    <span><i class="sq" style="background:var(--yellow)"></i> aguardando</span>
    <span><i class="sq" style="background:var(--green)"></i> carregado</span>
  </div>

</div>

<div class="addbar">
  <div class="addbar-inner">
    <input id="newName" placeholder="Nova carga — ex: PREFERIDA 3/4 WASH" autocomplete="off">
    <button id="addBtn">＋</button>
  </div>
</div>

<div class="modal-bg" id="nameModal">
  <div class="modal">
    <h3>Como você quer ser identificado?</h3>
    <p>Aparece em quem fez a última atualização. Fica salvo só neste aparelho.</p>
    <input id="nameInput" placeholder="Ex: Caio, Murilo, Rodrigo" autocomplete="off">
    <button id="saveNameBtn">Salvar</button>
  </div>
</div>

<div class="drawer-bg" id="drawerBg">
  <div class="drawer">
    <div class="drawer-handle"></div>
    <h3>Escolher data</h3>
    <div class="quickdates">
      <button id="qOntem">Ontem</button>
      <button id="qHoje">Hoje</button>
    </div>
    <div class="cal">
      <div class="cal-head">
        <button id="calPrev" aria-label="Mês anterior">‹</button>
        <span id="calMonthLabel"></span>
        <button id="calNext" aria-label="Próximo mês">›</button>
      </div>
      <div class="cal-weekdays">
        <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   1) CONFIGURAÇÃO DO FIREBASE
   ---------------------------------------------------------
   Crie um projeto gratuito em https://console.firebase.google.com
   → Build → Realtime Database → Criar banco (modo teste é ok pra começar)
   → Copie o "firebaseConfig" do seu projeto e cole AQUI embaixo,
     substituindo o objeto de exemplo.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDxyRGvWDP4cSTUgkknKtnxNsJtxtjDux4",
  authDomain: "pacemaker-85909.firebaseapp.com",
  projectId: "pacemaker-85909",
  storageBucket: "pacemaker-85909.firebasestorage.app",
  messagingSenderId: "724345484064",
  appId: "1:724345484064:web:8e6c41cb47adac3754dd45",
  measurementId: "G-CHNNY1872B",
  // ⚠️ COLE AQUI a databaseURL que aparece no topo do Realtime Database
  // (Console Firebase → Build → Realtime Database, depois de criar o banco).
  // Formato típico: "https://pacemaker-85909-default-rtdb.firebaseio.com"
  // ou, se a região não for EUA: "...-default-rtdb.southamerica-east1.firebasedatabase.app"
  databaseURL: "https://pacemaker-85909-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

// Verificação: avisa na tela em vez de falhar em silêncio
if(!firebaseConfig.databaseURL || firebaseConfig.databaseURL.includes('COLE_AQUI')){
  document.addEventListener('DOMContentLoaded', () => {
    document.body.innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;
        background:#0B0F14;color:#E8EDF2;font-family:Inter,sans-serif;padding:24px;text-align:center;">
        <div style="max-width:420px;">
          <div style="font-size:32px;margin-bottom:12px;">⚠️</div>
          <h2 style="font-family:Oswald,sans-serif;margin:0 0 10px;">databaseURL não configurada</h2>
          <p style="color:#7C8B99;font-size:14px;line-height:1.5;">
            Abra o Console do Firebase → Build → Realtime Database → crie o banco se ainda não existir
            → copie a URL mostrada no topo da página → cole no campo <code>databaseURL</code>
            dentro do <code>firebaseConfig</code>, no início deste arquivo.
          </p>
        </div>
      </div>`;
  });
  throw new Error('databaseURL ausente no firebaseConfig');
}

const db = firebase.database();

/* ========================================================= */

const STATUS_ORDER = ['red','yellow','green'];
const STATUS_ICON = {
  red: '',
  yellow: '',
  green: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#06140D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

let myName = localStorage.getItem('followup_name') || '';
let currentDateKey = todayKey();
let items = [];
let dbRef = null;
let connected = false;

function todayKey(offsetDays = 0){
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0,10); // YYYY-MM-DD
}
function fmtDateLabel(key){
  const [y,m,d] = key.split('-');
  return `${d}-${m}`;
}
function fmtTimeAgo(ts){
  if(!ts) return '';
  const diff = Math.floor((Date.now() - ts)/1000);
  if(diff < 60) return 'agora';
  if(diff < 3600) return `há ${Math.floor(diff/60)} min`;
  if(diff < 86400) return `há ${Math.floor(diff/3600)}h`;
  return `há ${Math.floor(diff/86400)}d`;
}

/* ---------- NAME MODAL ---------- */
const nameModal = document.getElementById('nameModal');
const whoBtn = document.getElementById('whoBtn');
function refreshWhoBtn(){
  whoBtn.textContent = myName ? `você é: ${myName}` : 'definir seu nome';
}
whoBtn.onclick = () => {
  document.getElementById('nameInput').value = myName;
  nameModal.classList.add('open');
};
document.getElementById('saveNameBtn').onclick = () => {
  const v = document.getElementById('nameInput').value.trim();
  if(v){
    myName = v;
    localStorage.setItem('followup_name', v);
    refreshWhoBtn();
    nameModal.classList.remove('open');
  }
};
if(!myName){ nameModal.classList.add('open'); }
refreshWhoBtn();

/* ---------- DATE HEADER + DRAWER (calendário customizado) ---------- */
const dateBtn = document.getElementById('dateBtn');
const drawerBg = document.getElementById('drawerBg');
const calGrid = document.getElementById('calGrid');
const calMonthLabel = document.getElementById('calMonthLabel');

const WEEKDAYS = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

let calViewYear, calViewMonth; // mês sendo exibido no drawer
let datesWithData = new Set();

function dayLabel(key){
  if(key === todayKey(0)) return 'HOJE';
  if(key === todayKey(-1)) return 'ONTEM';
  const d = new Date(key + 'T00:00:00');
  return WEEKDAYS[d.getDay()];
}

function renderDateBtn(){
  dateBtn.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="5" width="18" height="16" rx="2"/>
      <path d="M3 9h18M8 3v4M16 3v4"/>
    </svg>
    <span>${dayLabel(currentDateKey)} · ${fmtDateLabel(currentDateKey)}</span>
  `;
}

// Carrega (uma vez por abertura) quais datas têm carregamentos lançados, pra exibir o pontinho
function loadDatesWithData(cb){
  db.ref('apps/followup/carregamentos').once('value').then(snap => {
    const val = snap.val() || {};
    datesWithData = new Set(
      Object.keys(val).filter(k => val[k] && val[k].items && Object.keys(val[k].items).length > 0)
    );
    cb && cb();
  }).catch(() => cb && cb());
}

function keyOf(y,m,d){
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function renderCalendar(){
  calMonthLabel.textContent = `${MONTHS[calViewMonth]} ${calViewYear}`;
  calGrid.innerHTML = '';

  const firstDow = new Date(calViewYear, calViewMonth, 1).getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();

  for(let i=0; i<firstDow; i++){
    const empty = document.createElement('div');
    empty.className = 'cal-day empty';
    calGrid.appendChild(empty);
  }

  for(let d=1; d<=daysInMonth; d++){
    const key = keyOf(calViewYear, calViewMonth, d);
    const btn = document.createElement('button');
    btn.className = 'cal-day';
    if(key === todayKey(0)) btn.classList.add('today');
    if(key === currentDateKey) btn.classList.add('selected');
    const hasDot = datesWithData.has(key);
    btn.innerHTML = `<span>${d}</span><span class="dot ${hasDot ? '' : 'empty-dot'}"></span>`;
    btn.onclick = () => { switchDate(key); closeDrawer(); };
    calGrid.appendChild(btn);
  }
}

function openDrawer(){
  const d = new Date(currentDateKey + 'T00:00:00');
  calViewYear = d.getFullYear();
  calViewMonth = d.getMonth();
  drawerBg.classList.add('open');
  loadDatesWithData(renderCalendar);
}
function closeDrawer(){ drawerBg.classList.remove('open'); }

dateBtn.onclick = openDrawer;
drawerBg.onclick = (e) => { if(e.target === drawerBg) closeDrawer(); };

document.getElementById('qOntem').onclick = () => { switchDate(todayKey(-1)); closeDrawer(); };
document.getElementById('qHoje').onclick = () => { switchDate(todayKey(0)); closeDrawer(); };

document.getElementById('calPrev').onclick = () => {
  calViewMonth--;
  if(calViewMonth < 0){ calViewMonth = 11; calViewYear--; }
  renderCalendar();
};
document.getElementById('calNext').onclick = () => {
  calViewMonth++;
  if(calViewMonth > 11){ calViewMonth = 0; calViewYear++; }
  renderCalendar();
};

function switchDate(key){
  currentDateKey = key;
  renderDateBtn();
  attachListener();
}

/* ---------- FIREBASE LISTENER ---------- */
function attachListener(){
  if(dbRef) dbRef.off();
  dbRef = db.ref('apps/followup/carregamentos/' + currentDateKey + '/items');
  dbRef.on('value', snap => {
    const val = snap.val() || {};
    items = Object.keys(val).map(id => ({id, ...val[id]}))
      .sort((a,b) => (a.seq ?? 0) - (b.seq ?? 0));
    render();
  });
}

db.ref('.info/connected').on('value', snap => {
  connected = snap.val() === true;
  document.getElementById('connDot').className = 'dot ' + (connected ? 'live' : 'off');
  document.getElementById('connText').textContent = connected ? 'ao vivo' : 'sem conexão';
});

/* ---------- WRITE HELPERS ---------- */
function showDbError(err){
  console.error('Firebase write error:', err);
  alert(
    'Não foi possível salvar no banco.\n\n' +
    'Motivo provável: as regras do Realtime Database estão bloqueando escrita ' +
    '(erro: ' + (err && err.message ? err.message : err) + ').\n\n' +
    'Verifique em Realtime Database → Regras se o caminho "apps/followup" ' +
    'tem .read e .write como true.'
  );
}

function writeItem(id, patch){
  db.ref(`apps/followup/carregamentos/${currentDateKey}/items/${id}`).update({
    ...patch,
    updatedBy: myName || '—',
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  }).catch(showDbError);
}

function addItem(name){
  const id = db.ref().push().key;
  const maxSeq = items.reduce((m,i) => Math.max(m, i.seq ?? 0), 0);
  db.ref(`apps/followup/carregamentos/${currentDateKey}/items/${id}`).set({
    name,
    status: 'red',
    seq: maxSeq + 1,
    updatedBy: myName || '—',
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  }).catch(showDbError);
}

function removeItem(id){
  db.ref(`apps/followup/carregamentos/${currentDateKey}/items/${id}`).remove().catch(showDbError);
}

function cycleStatus(item){
  const next = STATUS_ORDER[(STATUS_ORDER.indexOf(item.status) + 1) % STATUS_ORDER.length];
  writeItem(item.id, {status: next});
}

function moveItem(item, dir){
  const idx = items.findIndex(i => i.id === item.id);
  const swapIdx = idx + dir;
  if(swapIdx < 0 || swapIdx >= items.length) return;
  const a = items[idx], b = items[swapIdx];
  const updates = {};
  updates[`apps/followup/carregamentos/${currentDateKey}/items/${a.id}/seq`] = b.seq;
  updates[`apps/followup/carregamentos/${currentDateKey}/items/${b.id}/seq`] = a.seq;
  db.ref().update(updates).catch(showDbError);
}

function renameItem(item, newName){
  if(newName.trim() && newName !== item.name){
    writeItem(item.id, {name: newName.trim()});
  }
}

/* ---------- RENDER ---------- */
const listEl = document.getElementById('list');

function render(){
  listEl.innerHTML = '';

  if(items.length === 0){
    listEl.innerHTML = `<div class="empty"><b>Nenhuma carga lançada</b>Adicione a primeira carga do dia ali abaixo.</div>`;
    return;
  }

  items.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'item';

    row.innerHTML = `
      <div class="seq">${idx+1}</div>
      <div class="info">
        <input class="name" value="${escapeHtml(item.name||'')}" data-id="${item.id}">
        <div class="meta">${item.updatedBy ? item.updatedBy + ' · ' + fmtTimeAgo(item.updatedAt) : ''}</div>
      </div>
      <button class="status ${item.status}" data-id="${item.id}">${STATUS_ICON[item.status] || ''}</button>
      <div class="order">
        <button class="up" data-id="${item.id}" ${idx===0?'disabled':''}>▲</button>
        <button class="down" data-id="${item.id}" ${idx===items.length-1?'disabled':''}>▼</button>
      </div>
      <button class="del" data-id="${item.id}">✕</button>
    `;
    listEl.appendChild(row);
  });

  // bind events
  listEl.querySelectorAll('.status').forEach(btn => {
    btn.onclick = () => cycleStatus(items.find(i => i.id === btn.dataset.id));
  });
  listEl.querySelectorAll('.up').forEach(btn => {
    btn.onclick = () => moveItem(items.find(i => i.id === btn.dataset.id), -1);
  });
  listEl.querySelectorAll('.down').forEach(btn => {
    btn.onclick = () => moveItem(items.find(i => i.id === btn.dataset.id), 1);
  });
  listEl.querySelectorAll('.del').forEach(btn => {
    btn.onclick = () => {
      if(confirm('Remover esta carga da lista?')) removeItem(btn.dataset.id);
    };
  });
  listEl.querySelectorAll('.name').forEach(inp => {
    inp.onblur = () => renameItem(items.find(i => i.id === inp.dataset.id), inp.value);
    inp.onkeydown = (e) => { if(e.key === 'Enter') inp.blur(); };
  });
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- ADD BAR ---------- */
const newNameInput = document.getElementById('newName');
document.getElementById('addBtn').onclick = submitAdd;
newNameInput.onkeydown = (e) => { if(e.key === 'Enter') submitAdd(); };
function submitAdd(){
  const v = newNameInput.value.trim();
  if(!v) return;
  addItem(v);
  newNameInput.value = '';
  newNameInput.focus();
}

/* ---------- BOOT ---------- */
renderDateBtn();
attachListener();

// re-render time-ago labels periodically
setInterval(() => { render(); renderDateBtn(); }, 30000);
</script>
</body>
</html>
